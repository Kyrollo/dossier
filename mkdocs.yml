site_name: Dossier Documentation
site_description: Agentic Deep Research Platform: autonomous market & competitor synthesis with human-in-the-loop validation and verifiable citations
site_author: Kyrollo
repo_url: https://github.com/Kyrollo/dossier
repo_name: Kyrollo/dossier

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - Architecture: architecture.md
  - API Reference: api.md
  - Evaluation: evaluation.md
  - Operations & Runbook: operations.md
  - Security Model: security.md
